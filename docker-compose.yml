services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  ingest-rs:
    build:
      context: ./services/ingest-rs
      dockerfile: Dockerfile
    env_file: .env
    environment:
      RUST_LOG: info
      REDIS_URL: redis://redis:6379
      STOCKBIT_WS_URL: ${STOCKBIT_WS_URL:-wss://wss-jkt.trading.stockbit.com/ws}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-py:
    build:
      context: ./services/api-py
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      INGEST_MODE: ${INGEST_MODE:-redis} # redis | embedded
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
      ingest-rs:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
