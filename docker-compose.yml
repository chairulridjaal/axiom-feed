# Host data dirs. Used as bind mounts so the host (QC, offload, retention,
# inspection) sees exactly what the containers see. Named volumes are avoided
# because a named volume SHADOWS the host dir — the host then sees an empty
# directory while the container sees data (2026-09-21 incident).
AXIOM_SPOOL_HOST_DIR: /var/lib/axiom/spool
AXIOM_LAKE_HOST_DIR: /var/lib/axiom/lake
AXIOM_SPOOL_ARCHIVE_HOST_DIR: /var/lib/axiom/spool-archive

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  ingest-rs:
    build:
      context: ./services/ingest-rs
      dockerfile: Dockerfile
    env_file: .env
    environment:
      RUST_LOG: info
      REDIS_URL: redis://redis:6379
      STOCKBIT_WS_URL: ${STOCKBIT_WS_URL:-wss://wss-jkt.trading.stockbit.com/ws}
      AXIOM_SPOOL_DIR: ${AXIOM_SPOOL_DIR:-/var/lib/axiom/spool}
    volumes:
      # Bind mount (NOT a named volume): the host QC/offload/retention scripts
      # must see the same bytes the container writes.
      - type: bind
        source: ${AXIOM_SPOOL_HOST_DIR:-/var/lib/axiom/spool}
        target: /var/lib/axiom/spool
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-py:
    build:
      context: ./services/api-py
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      INGEST_MODE: ${INGEST_MODE:-redis} # redis | embedded
    volumes:
      # Cookie-based auth rotation; source of truth lives outside the repo.
      - /etc/axiom/cookies.json:/app/cookies.json
      # Writable env so rotated bearer/refresh tokens persist across restarts.
      # Without this, a rotated refresh token exists only in the container's
      # memory and is lost on restart, forcing a manual re-login.
      - /etc/axiom/feed.env:/app/.env
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
      ingest-rs:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
