syntax = "proto3";

package stockbit.datafeed.v1;

option go_package = "github.com/axiom-feed/proto/datafeed";

import "google/protobuf/timestamp.proto";

// Enums
enum TradeType {
  TRADE_TYPE_UNSPECIFIED = 0;
  TRADE_TYPE_BUY = 1;
  TRADE_TYPE_SELL = 2;
}

enum BoardType {
  BOARD_TYPE_UNSPECIFIED = 0;
  BOARD_TYPE_RG = 1; // Regular
  BOARD_TYPE_TN = 2; // Cash
  BOARD_TYPE_NG = 3; // Negotiated
}

// Supporting Messages
message Change {
  double value = 1;
  double percentage = 2;
}

message RunningTrade {
  google.protobuf.Timestamp websocket_time = 1;
  string stock = 2;
  double price = 3;
  double volume = 4;
  TradeType action = 5;
  bool is_global = 6;
  google.protobuf.Timestamp time = 7;
  Change change = 8;
  int64 trade_number = 9;
  BoardType market_board = 10;
  double value = 11;
}

message RunningTradeBatch {
  repeated RunningTrade batch = 1;
}

// LivePrice — real-time price snapshot per symbol.
// Synced 2026-09-03 against the official web client bundle
// (securities.transactional.datafeed.v1.LivePrice): field 6 is now `open`
// (was prev_close), 11 is `date` string, 12 `close`, 13 `prev`, 15 is a
// Change message (was raw bytes), 18 `is_index` bool. Fields 23/26/28
// confirmed on live wire 2026-09-03 (BBCA/TLKM/GOTO/IHSG capture);
// 24/25/27 never observed and are reserved.
message LivePrice {
  string stock_code = 1;
  double lastprice = 2;     // Last traded price
  double volume = 3;        // Total volume (shares)
  double high = 4;          // Day high
  double low = 5;           // Day low
  double open = 6;          // Day open price
  double frequency = 7;     // Number of trades today
  double frg_buy = 8;       // Foreign buy
  double frg_sell = 9;      // Foreign sell
  double average = 10;      // Average/VWAP price
  string date = 11;         // ISO-8601 timestamp as string
  double close = 12;        // Another price field
  double prev = 13;         // Previous close
  double value = 14;        // Total value traded (Rp)
  Change change = 15;       // Change info
  string order_verb = 16;
  int64 quantity = 17;
  bool is_index = 18;       // true for index (IHSG)
  int64 sequence_number = 19;
  int64 order_book_id = 20;
  int64 order_number = 21;
  int64 match_number = 22;
  int32 board_flag = 23;  // wire varint, always 1 in samples; exact enum TBD
  reserved 24, 25, 27;
  string match_time = 26;  // nano-precision ts, ~1ms after date; absent on indices
  double lot_volume = 28;  // == volume/100 (lots) on equities; index aggregate on IHSG
}

message Orderbook {
  string stock = 1;
  string body = 2;           // Pipe-delimited orderbook: "#O|BBCA|BID|7500;5145;16665500|..."
  int64 sequence = 3;        // Sequence/trade count
  int64 depth = 4;           // Depth or version count
  string time = 5;           // ISO-8601 timestamp (e.g., "2026-02-09T14:49:51.3663+07:00")
  // fields 6,7 not observed
  int32 type_flag = 8;       // Type flag (1 = observed)
  string server_time = 9;    // Server-side ISO-8601 timestamp
}

// OrderbookEntry is used by OrderBookBody (pure protobuf orderbook), not legacy Orderbook
message OrderbookEntry {
  double price = 1;
  double volume = 2;
  int32 orders = 3;
}

// Pure protobuf orderbook (preferred)
message OrderBookBody {
  string stock_symbol = 1;
  repeated Bid bid = 2;
  repeated Offer offer = 3;
  google.protobuf.Timestamp time = 4;
}

message Bid {
  double price = 1;
  double lot = 2;
}

message Offer {
  double price = 1;
  double lot = 2;
}

message PingResponse {
  google.protobuf.Timestamp timestamp = 1;
}

// Response Wrapper
message WebsocketWrapMessageChannel {
  oneof message_channel {
    RunningTrade running_trade = 1;
    PingResponse ping = 2;
    OrderBookBody orderbook_body = 6;  // Pure protobuf orderbook
    Error error = 7;                   // Server error, e.g. 401 unauthorized
    RunningTradeBatch running_trade_batch = 8;
    LivePrice liveprice = 9;
    Orderbook orderbook = 10;  // Hybrid orderbook (text body)
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_REQUEST = 400;
  ERROR_CODE_UNAUTHORIZED = 401;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

// Request Messages
message PingRequest {
  google.protobuf.Timestamp timestamp = 1;
}

message WebsocketChannel {
  repeated string watchlist = 1;
  repeated string order_book = 2;
  repeated string running_trade = 3;
  bool is_hotlist = 4;
  repeated string running_trade_batch = 5;
  repeated string liveprice = 6;
}

message WebsocketRequest {
  string user_id = 1;
  WebsocketChannel channel = 2;
  string key = 3;
  PingRequest ping = 4;
  string access_token = 5;
}